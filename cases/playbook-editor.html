<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Playbook Editor</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

        <style>
            :root {
                --color-bg: #F7F8FB;
                --color-surface: #FFFFFF;
                --color-text: #1A1A1A;
                --color-text-muted: #6B6B6B;
                --color-accent: #335EDD;
                --color-border: #BAC0C9;
            }

            .staticrypt-html { height: 100%; }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background: var(--color-bg);
                color: var(--color-text);
            }

            .staticrypt-content {
                height: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px 20px;
                box-sizing: border-box;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 420px;
            }

            .staticrypt-form {
                background: var(--color-surface);
                border: 0.5px solid var(--color-border);
                border-radius: 20px;
                padding: 36px 32px;
                text-align: left;
            }

            .staticrypt-tag {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 4px 10px;
                background: #EEF2FC;
                border: 0.5px solid;
                color: #2C51BD;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 500;
                margin-bottom: 14px;
            }

            .staticrypt-title {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: -0.015em;
                line-height: 1.2;
                margin: 0 0 8px 0;
                color: var(--color-text);
            }

            .staticrypt-instructions p {
                font-size: 15px;
                line-height: 1.55;
                color: var(--color-text-muted);
                margin: 0 0 24px 0;
            }

            .staticrypt-hr { display: none; }

            .staticrypt-password-container {
                position: relative;
                background: var(--color-bg);
                border: 0.5px solid var(--color-border);
                border-radius: 10px;
                margin-bottom: 14px;
                transition: border-color 0.15s ease;
            }
            .staticrypt-password-container:focus-within {
                border-color: var(--color-accent);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font: inherit;
                font-size: 15px;
                color: var(--color-text);
                outline: 0;
                padding: 14px 44px 14px 16px;
                width: 100%;
            }

            .staticrypt-form input::placeholder {
                color: var(--color-text-muted);
                opacity: 1;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 0.55;
                padding: 12px;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
                transition: opacity 0.15s ease;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.85; }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: none;
                outline: 0;
                background: var(--color-text);
                width: 100%;
                border: 0;
                border-radius: 999px;
                padding: 14px 22px;
                color: var(--color-bg);
                font: inherit;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: transform 0.15s ease, filter 0.15s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover {
                filter: brightness(120%);
                transform: translateY(-1px);
            }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(0); }

            label.staticrypt-remember { display: none !important; }
            .staticrypt-remember input[type="checkbox"] { display: none; }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--color-bg);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--color-border);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">

            <div class="staticrypt-spinner"></div>

                            Remember me

                        <input type="submit" class="staticrypt-decrypt-button" value="DECRYPT" />
                    </form>
                </div>
            </div>
